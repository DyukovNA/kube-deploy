name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.1
          cache-dependency-path: apps/backend/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install validation tools
        run: bash scripts/install-ci-tools.sh
      - name: Recheck source and declarations
        env:
          FRONTEND_IMAGE: ghcr.io/example/frontend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BACKEND_IMAGE: ghcr.io/example/backend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          REVISION: 0123456789abcdef0123456789abcdef01234567
        run: |
          export PATH="$PWD/.tools/bin:$PATH"
          npm ci --prefix apps/frontend
          make test lint
          (cd apps/backend && go test -race ./...)
          npm run build --prefix apps/frontend
          make render validate-generated
          kustomize build platform/clusters/local >/dev/null
          actionlint

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679fd # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set immutable release reference
        id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-$COMPONENT" >> "$GITHUB_OUTPUT"
      - name: Build amd64 candidate for vulnerability scan
        run: |
          docker build --platform linux/amd64 \
            --build-arg GIT_COMMIT="$GITHUB_SHA" \
            --build-arg BUILD_VERSION="sha-$GITHUB_SHA" \
            --build-arg SOURCE_URL="https://github.com/$GITHUB_REPOSITORY" \
            -t "kubedeploy-$COMPONENT:scan" "apps/$COMPONENT"
      - name: Install pinned Trivy
        run: |
          mkdir -p .tools/bin .tools/trivy-download
          gh release download v0.75.0 --repo aquasecurity/trivy \
            --pattern trivy_0.75.0_Linux-64bit.tar.gz \
            --pattern trivy_0.75.0_checksums.txt --dir .tools/trivy-download
          (cd .tools/trivy-download && shasum -a 256 -c trivy_0.75.0_checksums.txt --ignore-missing)
          tar -xzf .tools/trivy-download/trivy_0.75.0_Linux-64bit.tar.gz -C .tools/bin trivy
      - name: Reject fixable HIGH or CRITICAL vulnerabilities
        run: |
          .tools/bin/trivy image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 --format json \
            --output "trivy-$COMPONENT.json" "kubedeploy-$COMPONENT:scan"
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.component }}
          path: trivy-${{ matrix.component }}.json
          if-no-files-found: warn
      - name: Publish multi-platform image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.ref.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_VERSION=sha-${{ github.sha }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
      - name: Attest published digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.ref.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify remote digest and attestation
        env:
          IMAGE: ${{ steps.ref.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          remote_digest="$(docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" \
            --format '{{json .}}' | jq -er '.manifest.digest')"
          test "$remote_digest" = "$DIGEST"
          for attempt in 1 2 3 4 5; do
            if gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY" \
              --source-digest "$GITHUB_SHA" --source-ref refs/heads/main \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"; then
              echo "$IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attestation is not available yet (attempt $attempt/5)" >&2
            sleep 10
          done
          exit 1
