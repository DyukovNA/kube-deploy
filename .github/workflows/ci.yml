name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.27.1
          cache-dependency-path: apps/backend/go.sum
      - name: Check formatting and tests
        working-directory: apps/backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -cover ./...
          go build ./cmd/server

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.17.0
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install and test
        working-directory: apps/frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high

  platform:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned validation tools
        run: bash scripts/install-ci-tools.sh
      - name: Validate platform and generated workloads
        env:
          FRONTEND_IMAGE: ghcr.io/example/frontend@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          BACKEND_IMAGE: ghcr.io/example/backend@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          REVISION: 0123456789abcdef0123456789abcdef01234567
        run: |
          export PATH="$PWD/.tools/bin:$PATH"
          shellcheck -x -S warning scripts/*.sh
          actionlint
          yamllint platform cluster apps/postgres-chart/values.yaml apps/postgres-chart/Chart.yaml
          kustomize build platform/bootstrap/argocd | kubeconform -strict -summary -ignore-missing-schemas
          kustomize build platform/clusters/local | kubeconform -strict -summary -ignore-missing-schemas
          kustomize build platform/gateway | kubeconform -strict -summary -ignore-missing-schemas
          kustomize build platform/policies >/dev/null
          helm lint apps/postgres-chart
          helm template demo-postgres apps/postgres-chart --namespace kube-deploy-demo |
            kubeconform -strict -summary -ignore-missing-schemas
          make render
          make validate-generated
          make test-policies

  containers:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Dockerfile checks and candidate builds
        run: |
          docker build --check apps/backend
          docker build --check apps/frontend
          docker build -t kubedeploy-backend:ci apps/backend
          docker build -t kubedeploy-frontend:ci apps/frontend
      - name: Install pinned Trivy
        run: |
          mkdir -p .tools/bin .tools/trivy-download
          gh release download v0.75.0 --repo aquasecurity/trivy \
            --pattern trivy_0.75.0_Linux-64bit.tar.gz \
            --pattern trivy_0.75.0_checksums.txt --dir .tools/trivy-download
          (cd .tools/trivy-download && shasum -a 256 -c trivy_0.75.0_checksums.txt --ignore-missing)
          tar -xzf .tools/trivy-download/trivy_0.75.0_Linux-64bit.tar.gz -C .tools/bin trivy
      - name: Scan both images
        run: |
          set +e
          .tools/bin/trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 --format json --output trivy-backend.json kubedeploy-backend:ci
          backend_status=$?
          .tools/bin/trivy image --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL \
            --exit-code 1 --format json --output trivy-frontend.json kubedeploy-frontend:ci
          frontend_status=$?
          test "$backend_status" -eq 0 && test "$frontend_status" -eq 0
      - name: Upload scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-ci
          path: trivy-*.json
          if-no-files-found: warn

  ci-success:
    if: always()
    needs: [backend, frontend, platform, containers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every check
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
          CONTAINERS_RESULT: ${{ needs.containers.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$PLATFORM_RESULT" = success
          test "$CONTAINERS_RESULT" = success
