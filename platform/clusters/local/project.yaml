apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kube-deploy-platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  description: System resources only; demo Deployments and Services are Score-owned.
  sourceRepos:
    - https://example.invalid/kube-deploy.git
    - docker.io/envoyproxy
    - https://open-policy-agent.github.io/gatekeeper/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: envoy-gateway-system
    - server: https://kubernetes.default.svc
      namespace: gatekeeper-system
    - server: https://kubernetes.default.svc
      namespace: kube-deploy-system
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
    - group: gateway.networking.k8s.io
      kind: GatewayClass
    - group: templates.gatekeeper.sh
      kind: ConstraintTemplate
    - group: expansion.gatekeeper.sh
      kind: ExpansionTemplate
    - group: constraints.gatekeeper.sh
      kind: K8sNoPrivileged
    - group: constraints.gatekeeper.sh
      kind: K8sRequiredResources
    - group: constraints.gatekeeper.sh
      kind: K8sDisallowedImageTags
