apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-deploy-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DyukovNA/kube-deploy.git
    targetRevision: main
    path: platform/clusters/local
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
    syncOptions:
      - ServerSideApply=true
      - PruneLast=true
