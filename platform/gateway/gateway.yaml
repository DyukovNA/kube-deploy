apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kube-deploy
  namespace: kube-deploy-system
spec:
  gatewayClassName: kube-deploy-envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: kube-deploy.local
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway-access.kubedeploy.io/enabled: "true"
