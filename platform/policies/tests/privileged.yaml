apiVersion: v1
kind: Pod
metadata:
  name: rejected-privileged
  namespace: kube-deploy-demo
spec:
  containers:
    - name: bad
      image: busybox:1.37
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
